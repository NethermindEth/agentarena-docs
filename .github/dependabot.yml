# Dependabot keeps the lockfile and the pinned actions current. Majors are
# ignored for version updates and taken by hand; security updates ignore that
# rule and still open a pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-all:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
